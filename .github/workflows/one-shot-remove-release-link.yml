name: One-shot remove public release link
on:
  push:
    branches: [community-web]
    paths:
      - '.github/workflows/one-shot-remove-release-link.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-web
          fetch-depth: 0
      - name: Remove release link from public downloads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('community/src/app/page.tsx')
          s=p.read_text()
          old='''            {build.release_url ? (\n              <a className="textLink" href={build.release_url} target="_blank" rel="noreferrer">Ver release ↗</a>\n            ) : null}\n'''
          if old not in s:
              raise SystemExit('Expected release-link block not found; refusing broad edit')
          s=s.replace(old,'',1)
          if 'Ver release ↗' in s:
              raise SystemExit('Visible release link still present')
          p.write_text(s)
          PY
      - name: Verify community build
        working-directory: community
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit clean source and remove one-shot workflow
        run: |
          git config user.name 'byetale-web-bot'
          git config user.email 'byetale-web-bot@users.noreply.github.com'
          git rm .github/workflows/one-shot-remove-release-link.yml
          git add community/src/app/page.tsx
          git commit -m 'fix(web): remove release link from public downloads'
          git push origin HEAD:community-web
