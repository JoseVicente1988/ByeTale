name: Publish ByeTale Android 35.0.120

on:
  push:
    branches:
      - android-releases
    paths:
      - .github/workflows/publish-byetale-35120.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --output ByeTale-35.0.120-35120.apk \
            'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-d8c4-8210-8754-3b0187efb3e7/raw?se=2026-09-18T21%3A24%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=226f84d1-d692-57dd-b8c6-757db0836090&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T20%3A34%3A31Z&ske=2026-09-19T20%3A34%3A31Z&sks=b&skv=2026-02-06&sig=HDJokLflGjasAusTotxBEu/qeAAVLu0XLUfm0/bYBtw%3D'
          test "$(stat -c%s ByeTale-35.0.120-35120.apk)" = "59991551"
          echo "ab13e03cca15ef9568f2f8d938cedea206fd7da0c31f0ce38b494d7e9e5b951c  ByeTale-35.0.120-35120.apk" | sha256sum -c -

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v35.0.120"
          APK="ByeTale-35.0.120-35120.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "ByeTale 35.0.120" \
              --notes "Android build 35120. Mobile shop scrolling fix and updater test build."
          fi
