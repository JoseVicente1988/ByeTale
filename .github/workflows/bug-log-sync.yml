name: Sync game bug logs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bug-log-sync.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: byetale-bug-log-sync
  cancel-in-progress: false

env:
  SYNC_SCHEMA: '4'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout community-web
        uses: actions/checkout@v4
        with:
          ref: community-web
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export published bug reports
        env:
          BUG_EXPORT_URL: https://br-lively-unit-aygkh67q-buglogexport.compute.c-5.us-east-2.aws.neon.tech/
        run: python community/scripts/sync_bug_logs.py

      - name: Commit synchronized logs
        run: |
          git config user.name "byetale-bug-bot"
          git config user.email "byetale-bug-bot@users.noreply.github.com"
          git add community/docs/bug-reports
          if git diff --cached --quiet; then
            echo "No bug log changes"
            exit 0
          fi
          git commit -m "docs(bugs): sync game reports [skip ci]"
          git push origin HEAD:community-web
