name: ByeTale Community CI

on:
  push:
    branches: [community-web]
    paths:
      - 'community/**'
      - '.github/workflows/community-ci.yml'
  pull_request:
    paths:
      - 'community/**'
      - '.github/workflows/community-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify Vercel credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/community-web'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured for this repository"
            exit 1
          fi

      - name: Deploy ByeTale Community to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/community-web'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest --prod --yes \
            --token "$VERCEL_TOKEN" \
            --scope josevicente1988s-projects \
            --name byetale-community
