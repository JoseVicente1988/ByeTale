name: ByeTale Community CI

on:
  push:
    branches: [community-web]
    paths:
      - 'community/**'
      - '.github/workflows/community-ci.yml'
  pull_request:
    paths:
      - 'community/**'
      - '.github/workflows/community-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: community
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: community
        run: npm run typecheck

      - name: Production build
        working-directory: community
        run: npm run build

      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing"; exit 1; }
          echo "VERCEL_TOKEN is configured"

      - name: Ensure Vercel project exists
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          STATUS=$(curl -sS -o /tmp/vercel-project.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/byetale-community?teamId=team_XyjNhaZz7oxusZTQoGYgywKS")

          if [ "$STATUS" = "404" ]; then
            CREATE_STATUS=$(curl -sS -o /tmp/vercel-create.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v11/projects?teamId=team_XyjNhaZz7oxusZTQoGYgywKS" \
              --data '{"name":"byetale-community","framework":"nextjs","gitRepository":{"type":"github","repo":"JoseVicente1988/ByeTale"}}')
            cat /tmp/vercel-create.json
            test "$CREATE_STATUS" -ge 200 -a "$CREATE_STATUS" -lt 300
          else
            cat /tmp/vercel-project.json
            test "$STATUS" -ge 200 -a "$STATUS" -lt 300
          fi

      - name: Configure Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          STATUS=$(curl -sS -o /tmp/vercel-config.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/byetale-community?teamId=team_XyjNhaZz7oxusZTQoGYgywKS" \
            --data '{"framework":"nextjs","rootDirectory":"community","nodeVersion":"22.x"}')
          cat /tmp/vercel-config.json
          test "$STATUS" -ge 200 -a "$STATUS" -lt 300

      - name: Deploy community-web to production via Vercel REST API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          STATUS=$(curl -sS -o /tmp/vercel-deploy.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=team_XyjNhaZz7oxusZTQoGYgywKS" \
            --data '{"name":"byetale-community","project":"byetale-community","target":"production","gitSource":{"type":"github","org":"JoseVicente1988","repo":"ByeTale","ref":"community-web"}}')
          cat /tmp/vercel-deploy.json
          test "$STATUS" -ge 200 -a "$STATUS" -lt 300
          DEPLOYMENT_ID=$(node -e "const d=require('/tmp/vercel-deploy.json'); process.stdout.write(d.id || '')")
          DEPLOYMENT_URL=$(node -e "const d=require('/tmp/vercel-deploy.json'); process.stdout.write(d.url || '')")
          test -n "$DEPLOYMENT_ID"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> "$GITHUB_ENV"

      - name: Wait for Vercel production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            curl -sS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=team_XyjNhaZz7oxusZTQoGYgywKS" \
              > /tmp/vercel-status.json
            STATE=$(node -e "const d=require('/tmp/vercel-status.json'); process.stdout.write(d.readyState || d.status || '')")
            echo "Vercel state: $STATE"
            if [ "$STATE" = "READY" ]; then
              cat /tmp/vercel-status.json
              exit 0
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              cat /tmp/vercel-status.json
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for Vercel deployment"
          cat /tmp/vercel-status.json
          exit 1

      - name: Print production URL
        run: |
          echo "Production deployment: https://$DEPLOYMENT_URL"
          echo "Stable alias: https://byetale-community-josevicente1988s-projects.vercel.app"
