<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" shape-rendering="crispEdges">
  <defs>
    <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <rect width="2" height="2" x="0" y="0" fill="#e6eef0" opacity=".08"/>
      <rect width="2" height="2" x="4" y="4" fill="#345261" opacity=".08"/>
    </pattern>
    <pattern id="skyPixels" width="96" height="72" patternUnits="userSpaceOnUse">
      <rect x="13" y="18" width="3" height="3" fill="#eef4ee" opacity=".15"/>
      <rect x="70" y="41" width="2" height="2" fill="#f4e5b3" opacity=".12"/>
      <rect x="42" y="8" width="2" height="2" fill="#dce9ec" opacity=".15"/>
    </pattern>
  </defs>

  <!-- bright dawn sky -->
  <rect width="1920" height="1080" fill="#789caf"/>
