  <rect x="666" y="730" width="24" height="20" fill="#e28a3e" opacity=".80"/>
  <rect x="672" y="722" width="12" height="26" fill="#ffd774" opacity=".95"/>
  <rect x="676" y="716" width="5" height="18" fill="#fff5b2"/>

