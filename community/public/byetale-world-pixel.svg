  <rect x="674" y="736" width="8" height="38" fill="#4d3826"/>
  <rect x="666" y="724" width="24" height="20" fill="#c87335" opacity=".7"/>
  <rect x="672" y="716" width="12" height="26" fill="#f2c45f" opacity=".9"/>
