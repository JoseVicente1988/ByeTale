<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" shape-rendering="crispEdges">
  <defs>
    <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <rect width="2" height="2" x="0" y="0" fill="#b9c4d0" opacity=".12"/>
      <rect width="2" height="2" x="4" y="4" fill="#0a1320" opacity=".18"/>
    </pattern>
    <pattern id="stars" width="96" height="72" patternUnits="userSpaceOnUse">
      <rect x="13" y="18" width="3" height="3" fill="#e9d8a5" opacity=".55"/>
      <rect x="70" y="41" width="2" height="2" fill="#d7e7ef" opacity=".42"/>
      <rect x="42" y="8" width="2" height="2" fill="#f1dca0" opacity=".32"/>
    </pattern>
  </defs>

  <!-- twilight sky -->
  <rect width="1920" height="1080" fill="#172335"/>
